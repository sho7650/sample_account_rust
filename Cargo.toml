[package]
name        = "sample_account"
version     = "0.4.7"
edition     = "2021"
description = "Synthetic Japanese personal-account CSV generator (Rust port)"
license     = "MIT"
authors     = ["sho <sho@oshiire.to>"]
readme      = "README.md"

[dependencies]
rand  = { version = "0.9", features = ["small_rng"] }
rayon = "1.10"
time  = "0.3"

[profile.release]
opt-level = 3
lto       = "thin"
