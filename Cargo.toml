[package]
name         = "sample_account"
version      = "0.5.0"
edition      = "2021"
rust-version = "1.75"
description  = "Synthetic Japanese personal-account CSV generator (Rust port)"
license      = "MIT"
authors      = ["sho <sho@oshiire.to>"]
readme       = "README.md"
repository   = "https://github.com/sho7650/sample_account_rust"
homepage     = "https://github.com/sho7650/sample_account_rust"
keywords     = ["csv", "synthetic-data", "japan", "data-generator"]
categories   = ["command-line-utilities"]
include      = [
    "src/**/*.rs",
    "data/*.csv",
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
]

[dependencies]
rand  = { version = "0.9", features = ["small_rng"] }
rayon = "1.10"
time  = "0.3"

[profile.release]
opt-level = 3
lto       = "thin"
