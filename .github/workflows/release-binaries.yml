name: release-binaries

# Triggered by release-please when its release PR is merged. The
# release-please action calls the GitHub Releases API which fires
# `release: created`. Verified per:
# https://github.com/taiki-e/upload-rust-binary-action#supported-events
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  upload-assets:
    name: ${{ matrix.target }}
    permissions:
      contents: write   # for taiki-e/upload-rust-binary-action to upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3 native targets only. No cross-compilation. Niche-platform
          # users (Linux ARM/musl, Intel macOS, Windows MinGW) build from
          # source via `cargo install --git`. See docs/design-embed-and-cicd.md §5.
          - target: x86_64-unknown-linux-gnu
            os:     ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os:     windows-latest
          - target: aarch64-apple-darwin
            os:     macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin:      sample_account
          target:   ${{ matrix.target }}
          archive:  $bin-$tag-$target
          tar:      unix
          zip:      windows
          include:  LICENSE,README.md
          checksum: sha256
          token:    ${{ secrets.GITHUB_TOKEN }}
