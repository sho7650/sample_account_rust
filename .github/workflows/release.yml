name: release

# Two entry points:
#
# 1. push:main — normal release-please flow.
#    The release-please job runs on every main push; it opens/updates a
#    release PR. When that PR is merged, release_created becomes true and
#    upload-assets builds the 3 native binaries and attaches them to the
#    fresh GitHub Release in the SAME workflow run.
#
#    Why one workflow instead of two? Because GitHub explicitly blocks
#    GITHUB_TOKEN-created events from triggering new workflow runs:
#    https://github.com/googleapis/release-please-action#triggering
#      "When you use the repository's GITHUB_TOKEN to perform tasks,
#       events triggered by the GITHUB_TOKEN will not create a new
#       workflow run."
#    A separate `on: release` workflow would never fire from
#    release-please's release. Chaining via `needs:` in one workflow
#    sidesteps this without needing a Personal Access Token.
#
# 2. workflow_dispatch — manual backfill / signing dry-run.
#    Use to (a) backfill assets to an old release that was cut before
#    the asset pipeline existed, or (b) dry-run the signing pipeline on
#    a throwaway tag (e.g. v0.0.0-signing-test) before merging changes
#    to the workflow itself. Pass `tag` = `v0.6.0`; release-please is
#    skipped, upload-assets runs against the supplied tag.
#
# Signing chain per target:
#   Linux x86_64    : cosign keyless (sigstore OIDC) on the archive.
#   macOS aarch64   : Developer ID Application + Hardened Runtime +
#                     Apple notarytool + stapler, then cosign keyless.
#   Windows x86_64  : cosign keyless only. Authenticode signing is
#                     DEFERRED — SignPath.io's Free Trial does not
#                     support Trusted Build Systems (OIDC origin
#                     verification), and an API-token-only setup is
#                     not safe enough. Windows users will continue to
#                     see the SmartScreen warning; they can still
#                     verify provenance via cosign. Re-enable when the
#                     SignPath Foundation OSS tier is approved.
# .sha256 checksums are generated AFTER all signing/staple steps because
# signing changes bytes — pre-sign checksums would be wrong.
#
# Required GitHub Secrets (all stored in the `release-signing`
# environment with required-reviewer protection):
#   MACOS_DEVELOPER_ID_P12_BASE64       base64-encoded .p12 export of the
#                                       Developer ID Application certificate
#   MACOS_DEVELOPER_ID_P12_PASSWORD     password set when exporting the .p12
#   MACOS_DEVELOPER_ID_IDENTITY         exact `security find-identity` string,
#                                       e.g. "Developer ID Application: NAME (TEAMID)"
#   MACOS_NOTARY_API_KEY_BASE64         base64-encoded App Store Connect API
#                                       key (.p8) with Developer role
#   MACOS_NOTARY_API_KEY_ID             10-char Key ID from App Store Connect
#   MACOS_NOTARY_API_ISSUER_ID          UUID Issuer ID from App Store Connect
#
# See docs/release-signing.md for the full setup + rotation runbook.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to backfill binaries to (e.g. v0.6.0). Leave empty for normal release-please flow."
        required: false
        default: ""

permissions:
  contents:      write
  issues:        write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name:        ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file:   release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-assets:
    needs: release-please
    # Run when:
    #   - push:main and release-please created a new release; OR
    #   - workflow_dispatch with a non-empty `tag` input.
    # `always()` is required so this job evaluates even when
    # `release-please` is skipped (workflow_dispatch path).
    if: |
      always() &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    # Environment-scoped secrets. The `release-signing` environment
    # MUST be created in repo Settings → Environments and populated
    # with the secrets listed at the top of this file. Required-
    # reviewer protection on this environment is recommended (forces
    # a manual approval before any release attaches signed binaries).
    environment: release-signing
    permissions:
      contents: write   # gh release upload
      id-token: write   # cosign keyless OIDC
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3 native targets only. No cross-compilation. See
          # docs/design-embed-and-cicd.md §5 for rationale.
          - target:      x86_64-unknown-linux-gnu
            os:          ubuntu-latest
            archive_ext: tar.gz
            bin_ext:     ""
          - target:      x86_64-pc-windows-msvc
            os:          windows-latest
            archive_ext: zip
            bin_ext:     ".exe"
          - target:      aarch64-apple-darwin
            os:          macos-latest
            archive_ext: tar.gz
            bin_ext:     ""
    runs-on: ${{ matrix.os }}
    env:
      # Resolved tag (release-please output OR workflow_dispatch input).
      RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # Check out the *tagged* source so the build matches what the
      # release page advertises.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || needs.release-please.outputs.tag_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          # Release builds are infrequent; restore-only is fine.
          save-if: "false"
          key: release-${{ matrix.target }}

      - name: cargo build --release
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      # ----- macOS: codesign + notarize + staple -----
      # Runs only on the macOS matrix entry.

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          P12_BASE64:   ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Random keychain password — never read or persisted.
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$P12_BASE64" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to use the imported key without an interactive prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Make this the default search list so codesign finds the cert.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          rm -f "$P12_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: codesign with Developer ID + Hardened Runtime (macOS)
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail
          BIN_PATH="target/${{ matrix.target }}/release/sample_account"

          codesign --force \
                   --options=runtime \
                   --timestamp \
                   --sign "$IDENTITY" \
                   "$BIN_PATH"

          codesign --verify --deep --strict --verbose=2 "$BIN_PATH"

      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS'
        env:
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID:     ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID:  ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          BIN_PATH="target/${{ matrix.target }}/release/sample_account"
          KEY_PATH="$RUNNER_TEMP/notary_api_key.p8"
          ZIP_PATH="$RUNNER_TEMP/notarize-input.zip"

          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          # notarytool requires zip / dmg / pkg input. Zip the lone
          # binary at top-level (not inside a folder).
          /usr/bin/ditto -c -k --keepParent "$BIN_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --key      "$KEY_PATH" \
            --key-id   "$NOTARY_KEY_ID" \
            --issuer   "$NOTARY_ISSUER_ID" \
            --wait \
            --timeout  30m

          rm -f "$KEY_PATH" "$ZIP_PATH"

          # Staple the notarization ticket so the binary verifies offline.
          # Apple's CloudKit can take 30s-3min to propagate the ticket
          # after notarytool reports Accepted; stapler exits 73
          # ("CloudKit returned error 4096") if it polls before the
          # ticket is visible. Retry with exponential-ish backoff.
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$BIN_PATH"; then
              echo "stapler staple succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::stapler staple failed after 6 attempts (CloudKit propagation timeout)" >&2
              exit 1
            fi
            echo "stapler attempt $attempt failed; sleeping 30s before retry"
            sleep 30
          done
          xcrun stapler validate "$BIN_PATH"

      - name: Cleanup keychain (macOS)
        if: runner.os == 'macOS' && always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      # ----- Windows: Authenticode signing DEFERRED -----
      # No code-signing of the .exe at this time. cosign keyless
      # (below) still produces verifiable provenance for the archive.
      # Re-enable Authenticode signing once SignPath.io Foundation OSS
      # tier is approved (the Free Trial does not support Trusted
      # Build Systems / OIDC origin verification, which we require).

      # ----- Build the release archive (all OSes) -----
      # All signing/staple work is complete by this point — the binary
      # bytes are now final and the archive can be hashed.

      - name: Assemble archive contents
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dist/sample_account-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/sample_account${{ matrix.bin_ext }}" "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"

      - name: Pack tar.gz (Linux / macOS)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="dist/sample_account-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          # Files at archive root (matches the existing taiki-e layout
          # users already pull from older releases).
          tar -C "$STAGE_DIR" -czf "$ARCHIVE" .
          echo "ARCHIVE_PATH=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Pack zip (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $archive = "dist/sample_account-${env:RELEASE_TAG}-${{ matrix.target }}.zip"
          Compress-Archive -Path "${env:STAGE_DIR}/*" -DestinationPath $archive -Force
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generate SHA-256 checksum (post-signing)
        shell: bash
        run: |
          set -euo pipefail
          # POST-signing checksum — running this earlier produces wrong
          # values because notarization staple + Authenticode embed change
          # the binary bytes (and therefore the archive bytes).
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$ARCHIVE_PATH")") > "${ARCHIVE_PATH}.sha256"
          else
            (cd dist && shasum -a 256 "$(basename "$ARCHIVE_PATH")") > "${ARCHIVE_PATH}.sha256"
          fi

      # ----- cosign keyless signing of the final archive (all OSes) -----

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign archive with cosign keyless
        shell: bash
        run: |
          set -euo pipefail
          # Sigstore bundle (signature + cert + Rekor inclusion proof)
          # in a single file users can verify offline against the Rekor
          # transparency log entry.
          cosign sign-blob \
            --yes \
            --bundle "${ARCHIVE_PATH}.cosign.bundle" \
            "$ARCHIVE_PATH"

      # ----- Upload to the GitHub Release -----

      - name: Upload archive + checksum + cosign bundle
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$ARCHIVE_PATH" \
            "${ARCHIVE_PATH}.sha256" \
            "${ARCHIVE_PATH}.cosign.bundle" \
            --clobber
